name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST scan
        run: |
          semgrep scan \
            --config p/nodejs \
            --config p/javascript \
            --sarif \
            --output semgrep.sarif \
            src/
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast
  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start application
        run: |
          docker build -t devsecops-app:test .
          docker run -d -p 3000:3000 --name app devsecops-app:test
          sleep 5

      - name: Wait for application to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/health | grep -q healthy; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start"
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          fail_action: true
          artifact_name: zap-report

      - name: Stop application
        if: always()
        run: docker stop app && docker rm app
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [sast, container-scan, dast]
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t devsecops-app:${{ github.sha }} .
          echo "Image built: devsecops-app:${{ github.sha }}"

      - name: Simulate ECR push
        run: |
          echo "Pushing image to ECR..."
          echo "Image URI: 123456789012.dkr.ecr.us-east-1.amazonaws.com/devsecops-app:${{ github.sha }}"
          echo "Push complete."

      - name: Simulate ECS staging deployment
        run: |
          echo "Updating ECS task definition..."
          echo "  Cluster: devsecops-staging"
          echo "  Service: devsecops-app-staging"
          echo "  Image: devsecops-app:${{ github.sha }}"
          echo "  CPU: 256 | Memory: 512"
          echo "Waiting for service stability..."
          echo "Deployment to staging complete."

      - name: Run staging smoke test
        run: |
          # Start the container locally to verify it works
          docker run -d -p 3000:3000 --name staging-app devsecops-app:${{ github.sha }}
          sleep 5
          # Health check
          if curl -s http://localhost:3000/health | grep -q healthy; then
            echo "Staging smoke test PASSED"
          else
            echo "Staging smoke test FAILED"
            exit 1
          fi
          docker stop staging-app && docker rm staging-app

      - name: Record deployment
        run: |
          echo "STAGING_IMAGE=devsecops-app:${{ github.sha }}" >> $GITHUB_ENV
          echo "Staging deployment recorded at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
