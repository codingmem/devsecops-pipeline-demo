
name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:

  # ==========================================
  # JOB 1: SAST - SEMGREP
  # ==========================================
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep SAST scan
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/nodejs \
            --config p/javascript \
            --sarif \
            --output semgrep.sarif \
            src/

      - name: Upload Semgrep SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

  # ==========================================
  # JOB 2: CONTAINER SECURITY - TRIVY
  # ==========================================
  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  # ==========================================
  # JOB 3: DAST - OWASP ZAP
  # ==========================================
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: container-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-app:test .

      - name: Start application container
        run: |
          docker run -d \
            -p 3000:3000 \
            --name app \
            devsecops-app:test

      - name: Wait for application health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health | grep -q healthy; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to start"
          docker logs app
          exit 1

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          fail_action: true
          artifact_name: zap-report

      - name: Stop application container
        if: always()
        run: |
          docker stop app || true
          docker rm app || true

  # ==========================================
  # JOB 4: DEPLOY TO STAGING
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [sast, container-scan, dast]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t devsecops-app:${{ github.sha }} .
          echo "Image built successfully"

      - name: Simulate ECR push
        run: |
          echo "Pushing image to ECR..."
          echo "Image URI: 123456789012.dkr.ecr.us-east-1.amazonaws.com/devsecops-app:${{ github.sha }}"
          echo "Push complete."

      - name: Simulate ECS staging deployment
        run: |
          echo "Updating ECS task definition..."
          echo "Cluster: devsecops-staging"
          echo "Service: devsecops-app-staging"
          echo "Deployment to staging complete."

      - name: Run staging smoke test
        run: |
          docker run -d -p 3000:3000 --name staging-app devsecops-app:${{ github.sha }}
          sleep 5

          if curl -fsS http://localhost:3000/health | grep -q healthy; then
            echo "Staging smoke test PASSED"
          else
            echo "Staging smoke test FAILED"
            docker logs staging-app
            docker stop staging-app || true
            docker rm staging-app || true
            exit 1
          fi

          docker stop staging-app
          docker rm staging-app

      - name: Record deployment
        run: |
          echo "STAGING_IMAGE=devsecops-app:${{ github.sha }}" >> $GITHUB_ENV
          echo "Staging deployment recorded at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
